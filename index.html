<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Claude Quota</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header>
      <h1>Claude Quota</h1>
      <div class="header-actions">
        <span id="updated" class="muted"></span>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </header>
    <main id="accounts" aria-live="polite"></main>
    <form id="add-form" class="add">
      <input
        id="email"
        type="email"
        placeholder="email (optional, pre-fills login)"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="add" type="submit">Add account</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </form>
    <p id="notice" class="message" role="status"></p>
  </body>
</html>
