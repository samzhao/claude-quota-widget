<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Claude Quota</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
    <div id="content">
    <header data-tauri-drag-region>
      <h1 data-tauri-drag-region>
        <img src="/src/assets/logo.svg" alt="" width="20" height="20" data-tauri-drag-region />
        Claude Quota
      </h1>
      <div class="header-actions">
        <div class="segmented" role="group" aria-label="View">
          <button id="view-grid" type="button" aria-pressed="true">Grid</button>
          <button id="view-cards" type="button" aria-pressed="false">Cards</button>
        </div>
        <button id="refresh" type="button" title="Refresh now">Refresh</button>
        <button id="pin" type="button" class="icon-button" aria-pressed="false" aria-label="Pin on top">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
            <path d="M9.8 1.5 14.5 6.2l-1.6.5-2.3 2.3.2 3.2-1.2 1.2-3-3L2.8 14.2l-1-1L5.6 9.4l-3-3 1.2-1.2 3.2.2 2.3-2.3z" fill="currentColor" />
          </svg>
        </button>
      </div>
    </header>

    <main id="accounts" aria-live="polite"></main>

    <footer>
      <form id="add-form" class="add">
        <button id="add" type="submit">Add account</button>
        <button id="cancel" type="button" hidden>Cancel</button>
        <button id="email-toggle" type="button" class="link">Pre-fill an email</button>
        <input
          id="email"
          type="email"
          placeholder="name@example.com"
          aria-label="Email to pre-fill on the login page"
          autocomplete="off"
          spellcheck="false"
          hidden
        />
      </form>
      <div class="footer-meta">
        <label class="check">
          <input id="hide-unused" type="checkbox" />
          Hide unused limits
        </label>
        <label class="check" id="compact-wrap" hidden>
          <input id="compact" type="checkbox" />
          Compact cards
        </label>
        <label class="check" title="Off: the app lives only in the menubar. Closing the window hides it either way.">
          <input id="dock-icon" type="checkbox" />
          Show in Dock
        </label>
        <label class="check">
          Theme
          <select id="theme">
            <option value="warm">Warm</option>
            <option value="instrument">Instrument</option>
          </select>
        </label>
      </div>
      <div class="footer-meta">
        <p id="updated" class="muted"></p>
        <button id="fit" type="button" class="link" hidden title="You resized the window by hand. This goes back to fitting the content.">Fit to content</button>
        <button id="quit" type="button" class="link">Quit Claude Quota</button>
      </div>
      <p id="notice" class="message" role="status"></p>
    </footer>
    </div>
    </div>
  </body>
</html>
